services:
  web:
    image: alpine
    command: "$$VAR_NOT_INTERPOLATED_BY_COMPOSE"
  foo:
    image: alpine
    labels:
      foo1: "${VAR_INTERPOLATED_BY_COMPOSE}"
      foo2: "$VAR_INTERPOLATED_BY_COMPOSE"
      foo3: "${MISSING_VAR_INTERPOLATED_BY_COMPOSE:-default}"
      foo4: "${MISSING_VAR_INTERPOLATED_BY_COMPOSE:-${VAR_INTERPOLATED_BY_COMPOSE}}"
  bar:
    image: ${MISSING_VAR_INTERPOLATED_BY_COMPOSE:-}busybox
    labels:
      - "$VAR_INTERPOLATED_BY_COMPOSE=BAR"
    healthcheck:
      test: ["CMD", "curl", "-f", "$VAR_INTERPOLATED_BY_COMPOSE"]
  rep:
    image: ${VAR_INTERPOLATED_BY_COMPOSE:-}busybox
    healthcheck:
      test: curl -f $VAR_INTERPOLATED_BY_COMPOSE
  shell:
    image: busybox:1.36
    environment:
      GREETING: hello
    command:
      - sh
      - -c
      - |
        echo "$$GREETING"
        for k in a b; do echo "item $$k"; done
        echo "price: $$5/month"
        echo "$$(date) $$$$"
